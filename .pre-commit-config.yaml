# Runs on every `git commit`. Install once: uv run pre-commit install
# Update pinned versions: uv run pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-env-files
        name: block committing .env files
        entry: ".env files must never be committed — use .env.example"
        language: fail
        files: '(^|/)\.env$'
      - id: no-openai-keys
        name: block OpenAI-style API keys
        entry: 'sk-[A-Za-z0-9_-]{20,}'
        language: pygrep
        exclude: '^learn/'   # lessons contain a deliberately fake example key
