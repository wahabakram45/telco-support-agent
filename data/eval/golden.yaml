# Golden set for retrieval and generation evals. Lesson 05.
#
# relevant: chunks that answer the question = chunks of `doc` whose text contains `has`
#   (ignores case and **bold**; no `has` = any chunk of the doc). grade 2 = answers it, 1 = partial.
#   Empty = no document answers it (out of scope): skipped by retrieval metrics, used in lesson 06.
# distractors: documents that would lead to a wrong answer if retrieved (other plan, old version…).
# source: hand (written for a trap), synthetic (scripts/generate_golden.py, then reviewed), seed
#   (found by break-testing in lesson 04, see seed_questions.yaml).
#
# Synthetic review log: 40 chunks sampled → 7 auto-rejected (evidence not verbatim) → 33 reviewed:
#   19 kept (3 edited), 14 dropped (11 ambiguous, e.g. "the KSA prepaid plan" when 5 exist;
#   1 duplicate of a hand item; 1 trivial; 1 too complex to label reliably).
# Label audit of the first baseline's 5 misses: 1 was a labelling error (h-021), fixed.

