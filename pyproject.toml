[project]
name = "telco-support-agent"
version = "0.1.0"
description = "Telecom support RAG agent with evals — an AI engineering learning project"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_support_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # lesson snippets are hand-formatted for reading

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real OpenAI API (costs money; run with -m live)"]
addopts = "-m 'not live'"
