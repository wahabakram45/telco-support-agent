# CI: lint + unit tests on every push and pull request (free, no API key needed).
# The eval gate runs on pull requests only, and only if the repository has an OPENAI_API_KEY
# secret (Settings → Secrets and variables → Actions). It costs about $0.05 per run.
# See learn/06-generation-evals.md §9.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  eval-gate:
    if: github.event_name != 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.4-nano' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
    steps:
      - name: Skip without an API key
        if: env.HAS_KEY != 'true'
        run: echo "No OPENAI_API_KEY secret; skipping the eval gate."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: astral-sh/setup-uv@v6
        if: env.HAS_KEY == 'true'
        with:
          version: "0.13.6"
      - if: env.HAS_KEY == 'true'
        run: uv sync --locked
      - name: Build the index (~$0.0002 of embeddings)
        if: env.HAS_KEY == 'true'
        run: uv run python scripts/build_index.py
      - name: Eval gate
        if: env.HAS_KEY == 'true'
        run: uv run python scripts/eval_gate.py
